[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dailycheckin_l"
dynamic = ["version"]
description = "一个 dailycheckin 仓库的fork"
readme = "README.md"
authors = [
    { name = "s_xun_s", email = "s_xun_s@163.com" }
]
license = { text = "MIT" }
requires-python = ">=3.9"

dependencies = [
    "pycryptodome==3.17",
    "requests~=2.32.4",
    "rsa~=4.0",
    "urllib3~=2.5.0",
    "beautifulsoup4~=4.12.3",
]

[project.urls]
Homepage = "https://sitoi.cn"
Documentation = "https://sitoi.github.io/dailycheckin/"

[project.scripts]
dailycheckin_l = "dailycheckin.main:checkin"

[tool.black]
line-length = 88
skip-string-normalization = true

[tool.autoflake]
check = true
verbose = true

[tool.isort]
profile = "black"

[tool.setuptools.dynamic]
version = { attr = "dailycheckin.__version__.__version__" }
